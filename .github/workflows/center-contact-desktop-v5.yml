name: Center desktop contact section v5

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/center-contact-desktop-v5.yml'

permissions:
  contents: write

jobs:
  center:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply centered desktop contact layout
        shell: python
        run: |
          from pathlib import Path
          path = Path('app/page.tsx')
          text = path.read_text(encoding='utf-8')
          marker = '/* contact-desktop-symmetry-v5 */'
          if marker in text:
              print('Already applied')
              raise SystemExit(0)
          css = '''@media(min-width:801px){
            .contact{padding:120px 0 110px}
            .contact .shell{width:min(1100px,calc(100% - 80px));margin:0 auto}
            .contactgrid{width:100%;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:90px;align-items:center}
            .contactgrid>div:first-child{width:100%;max-width:520px;justify-self:stretch}
            .contact h2{font-size:clamp(52px,5.5vw,76px);line-height:.98;max-width:520px;margin:0}
            .contact p{max-width:430px;margin-top:24px}
            .form{width:100%;max-width:520px;justify-self:stretch;gap:14px}
            .form input,.form textarea{width:100%;padding:17px 18px;border-radius:16px}
            .form textarea{min-height:170px}
            .form button{padding:13px 22px}
          } /* contact-desktop-symmetry-v5 */'''
          needle = '`;\nexport default function Home()'
          if needle not in text:
              raise SystemExit('Could not find CSS string terminator')
          path.write_text(text.replace(needle, css + needle, 1), encoding='utf-8')

      - name: Commit and push safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Center desktop contact section v5 [contact-desktop-symmetry-v5]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

# v5 retry-safe workflow